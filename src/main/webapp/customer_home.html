<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | SMS Portal</title>
    <script>
        // Session guard: redirect to login if not logged in as CUSTOMER
        fetch('SessionCheckServlet?required=CUSTOMER')
            .then(r => {
                if (r.status === 401) { window.location.href = 'login.html'; }
                if (r.status === 403) {
                    // Logged in but wrong role (admin) — send to correct page
                    r.json().then(d => {
                        if (d.role === 'ADMIN') window.location.href = 'admin_home.html';
                        else window.location.href = 'login.html';
                    });
                }
            })
            .catch(() => window.location.href = 'login.html');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #001f3f;
            --accent:  #007bff;
            --accent-hover: #0056b3;
            --danger:  #dc3545;
            --danger-hover: #c82333;
            --success: #28a745;
            --bg:      #f4f7f6;
            --card:    #ffffff;
            --text:    #1a1a1a;
            --muted:   #6c757d;
            --border:  #e0e0e0;
            --radius:  10px;
            --shadow:  0 4px 20px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; background: var(--bg); color: var(--text); }

        /* ── NAV ── */
        .navbar {
            background: var(--primary); color: white;
            padding: 0 30px; display: flex; align-items: center;
            justify-content: space-between; height: 64px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .navbar .brand { font-size: 1.3rem; font-weight: 700; }
        .navbar .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-btn {
            background: transparent; color: white; border: 2px solid rgba(255,255,255,0.3);
            padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
            font-weight: 600; transition: all 0.2s; font-family: inherit;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.15); border-color: white; }
        .nav-btn.active { background: var(--accent); border-color: var(--accent); }
        .nav-btn.logout { border-color: rgba(220,53,69,0.6); color: #ff8a8a; }
        .nav-btn.logout:hover { background: rgba(220,53,69,0.2); border-color: #ff8a8a; }

        /* ── LAYOUT ── */
        .main { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* ── ALERT ── */
        .alert {
            padding: 14px 20px; border-radius: var(--radius); margin-bottom: 24px;
            font-weight: 600; font-size: 0.95rem;
        }
        .alert-success { background: #d4edda; color: var(--success); border: 1px solid #c3e6cb; }
        .alert-danger  { background: #fde8ea; color: var(--danger);  border: 1px solid #f5c6cb; }

        /* ── TABS ── */
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
        .tab-btn {
            padding: 12px 24px; background: none; border: none; cursor: pointer;
            font-size: 1rem; font-weight: 600; color: var(--muted); border-radius: 6px 6px 0 0;
            transition: all 0.2s; font-family: inherit; border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: #f0f8ff; }
        .tab-btn:hover:not(.active) { color: var(--text); background: #f9f9f9; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── CARDS ── */
        .card {
            background: var(--card); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 30px; margin-bottom: 24px;
        }
        .card-title {
            font-size: 1.2rem; font-weight: 700; color: var(--primary);
            margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid var(--border);
        }

        /* ── FORM GRID ── */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-grid.single { grid-template-columns: 1fr; }
        .full { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .input-group input, .input-group textarea {
            padding: 11px 14px; font-size: 0.95rem; border: 2px solid var(--border);
            border-radius: 6px; transition: all 0.2s; color: var(--text); font-family: inherit;
            resize: vertical;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none; border-color: var(--accent);
            background: #f0f8ff; box-shadow: 0 0 0 4px rgba(0,123,255,0.1);
        }
        .input-group input::placeholder, .input-group textarea::placeholder { color: #adb5bd; }

        /* ── BUTTONS ── */
        .btn {
            padding: 12px 28px; border: none; border-radius: 30px; cursor: pointer;
            font-size: 1rem; font-weight: 700; transition: all 0.2s; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 6px rgba(0,123,255,0.2); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-danger  { background: var(--danger); color: white; }
        .btn-danger:hover  { background: var(--danger-hover); }
        .btn-sm { padding: 6px 16px; font-size: 0.85rem; border-radius: 20px; }

        /* ── SMS TABLE ── */
        .search-bar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
            margin-bottom: 20px; padding: 20px; background: #f8f9fa;
            border-radius: var(--radius); border: 1px solid var(--border);
        }
        .search-bar .input-group { flex: 1; min-width: 140px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th {
            background: var(--primary); color: white; padding: 12px 14px;
            text-align: left; font-weight: 600; white-space: nowrap;
        }
        th:first-child { border-radius: 6px 0 0 0; }
        th:last-child  { border-radius: 0 6px 0 0; }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9fa; }
        .no-data { text-align: center; color: var(--muted); padding: 40px; font-size: 1rem; }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.78rem; font-weight: 700;
        }
        .badge-out { background: #e8f4fd; color: var(--accent); }
        .sms-body-cell { max-width: 250px; word-break: break-word; }

        /* ── PROFILE ── */
        .profile-header {
            display: flex; align-items: center; gap: 20px; margin-bottom: 30px;
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 700; flex-shrink: 0;
        }
        .profile-header-text h2 { font-size: 1.4rem; color: var(--primary); }
        .profile-header-text p  { color: var(--muted); font-size: 0.95rem; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
            .search-bar { flex-direction: column; }
            .tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="brand">📡 SMS Portal</div>
    <div class="nav-links">
        <span id="welcomeUser" style="color:#b0c4de; font-size:0.9rem; margin-right:8px;"></span>
        <button class="nav-btn" onclick="showTab('send')">📤 Send SMS</button>
        <button class="nav-btn" onclick="showTab('history')">📋 History</button>
        <button class="nav-btn" onclick="showTab('profile')">👤 Profile</button>
        <button class="nav-btn logout" onclick="location.href='LogoutServlet'">🚪 Logout</button>
    </div>
</nav>

<div class="main">

    <!-- Alert -->
    <div id="globalAlert" style="display:none;" class="alert"></div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('send')"    id="tab-send">📤 Send SMS</button>
        <button class="tab-btn"        onclick="showTab('history')" id="tab-history">📋 SMS History</button>
        <button class="tab-btn"        onclick="showTab('profile')" id="tab-profile">👤 My Profile</button>
    </div>

    <!-- ══════════════════════════════════════
         TAB 1: SEND SMS
    ══════════════════════════════════════ -->
    <div class="tab-pane active" id="pane-send">
        <div class="card">
            <div class="card-title">📤 Send a New SMS</div>
            <form action="SendSmsServlet" method="POST">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="from">From (Twilio Sender ID / Number)</label>
                        <input type="text" id="from" name="from" placeholder="+12345678900 or MyCompany" required>
                    </div>
                    <div class="input-group">
                        <label for="to">To (Recipient Phone Number)</label>
                        <input type="tel" id="to" name="to" placeholder="+20101..." required>
                    </div>
                    <div class="input-group full">
                        <label for="body">Message Body</label>
                        <textarea id="body" name="body" rows="4" placeholder="Type your SMS message here..." required></textarea>
                    </div>
                </div>
                <div style="margin-top:20px; text-align:right;">
                    <button type="submit" class="btn btn-primary">📨 Send SMS</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ══════════════════════════════════════
         TAB 2: SMS HISTORY
    ══════════════════════════════════════ -->
    <div class="tab-pane" id="pane-history">
        <div class="card">
            <div class="card-title">📋 SMS History</div>

            <!-- Search / Filter -->
            <div class="search-bar">
                <div class="input-group">
                    <label>From</label>
                    <input type="text" id="filterFrom" placeholder="Filter by sender...">
                </div>
                <div class="input-group">
                    <label>To</label>
                    <input type="text" id="filterTo" placeholder="Filter by recipient...">
                </div>
                <div class="input-group">
                    <label>Start Date</label>
                    <input type="date" id="filterStart">
                </div>
                <div class="input-group">
                    <label>End Date</label>
                    <input type="date" id="filterEnd">
                </div>
                <button class="btn btn-primary btn-sm" onclick="loadHistory()" style="height:42px;">🔍 Search</button>
                <button class="btn btn-sm" onclick="clearFilters()" style="height:42px; background:#e9ecef; color:var(--text);">✕ Clear</button>
            </div>

            <div class="table-wrap">
                <table id="smsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="smsTableBody">
                        <tr><td colspan="6" class="no-data">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════
         TAB 3: PROFILE
    ══════════════════════════════════════ -->
    <div class="tab-pane" id="pane-profile">
        <div class="card">
            <div class="profile-header">
                <div class="avatar" id="avatarInitial">?</div>
                <div class="profile-header-text">
                    <h2 id="profileName">Loading...</h2>
                    <p id="profileEmail"></p>
                </div>
            </div>
            <div class="card-title">✏️ Edit Profile</div>
            <form action="ProfileServlet" method="POST" id="profileForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" name="name" id="pName" required>
                    </div>
                    <div class="input-group">
                        <label>Birthday</label>
                        <input type="date" name="birthday" id="pBirthday">
                    </div>
                    <div class="input-group">
                        <label>Phone (MSISDN)</label>
                        <input type="tel" name="phone" id="pPhone">
                    </div>
                    <div class="input-group">
                        <label>Job Title</label>
                        <input type="text" name="job" id="pJob">
                    </div>
                    <div class="input-group full">
                        <label>Address</label>
                        <input type="text" name="address" id="pAddress">
                    </div>
                    <div class="input-group full">
                        <label>Twilio Account SID</label>
                        <input type="text" name="twilio_sid" id="pSid">
                    </div>
                    <div class="input-group">
                        <label>Twilio Auth Token (leave blank to keep current)</label>
                        <input type="password" name="twilio_token" placeholder="••••••••">
                    </div>
                    <div class="input-group">
                        <label>Allowed Sender ID</label>
                        <input type="text" name="sender_id" id="pSender">
                    </div>
                    <div class="input-group full">
                        <label>New Password (leave blank to keep current)</label>
                        <input type="password" name="password" placeholder="Leave blank to keep unchanged">
                    </div>
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                </div>
            </form>
        </div>
    </div>

</div><!-- /main -->

<script>
// ── Tab switching ──────────────────────────────────────────────
function showTab(name) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pane-' + name).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'history') loadHistory();
    if (name === 'profile') loadProfile();
}

// ── Alert helper ───────────────────────────────────────────────
function showAlert(type, text) {
    const el = document.getElementById('globalAlert');
    el.className = 'alert alert-' + type;
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

// ── Parse URL params for flash messages ───────────────────────
const params = new URLSearchParams(window.location.search);
const msgs = {
    sms_sent:           { t:'success', m:'✅ SMS sent successfully!' },
    profile_updated:    { t:'success', m:'✅ Profile updated successfully!' },
    sms_failed:         { t:'danger',  m:'❌ Failed to send SMS. Check your Twilio credentials.' },
    profile_update_failed: { t:'danger', m:'❌ Profile update failed.' },
    missing_fields:     { t:'danger',  m:'❌ Please fill in all required fields.' }
};
const s = params.get('success') || params.get('error');
if (s && msgs[s]) showAlert(msgs[s].t, msgs[s].m);

// ── Welcome message ───────────────────────────────────────────
// We load from ProfileServlet on page load
window.addEventListener('DOMContentLoaded', () => {
    loadProfile();
});

// ── Load profile ──────────────────────────────────────────────
function loadProfile() {
    fetch('ProfileServlet')
        .then(r => r.json())
        .then(data => {
            document.getElementById('profileName').textContent  = data.name  || '';
            document.getElementById('profileEmail').textContent = data.email || '';
            document.getElementById('avatarInitial').textContent = (data.name || '?')[0].toUpperCase();
            document.getElementById('welcomeUser').textContent   = 'Hi, ' + (data.name || '');
            document.getElementById('pName').value     = data.name     || '';
            document.getElementById('pBirthday').value = data.birthday || '';
            document.getElementById('pPhone').value    = data.phone    || '';
            document.getElementById('pJob').value      = data.job      || '';
            document.getElementById('pAddress').value  = data.address  || '';
            document.getElementById('pSid').value      = data.twilio_sid || '';
            document.getElementById('pSender').value   = data.sender_id  || '';
        })
        .catch(() => {});
}

// ── Load SMS history ──────────────────────────────────────────
function loadHistory() {
    const from  = document.getElementById('filterFrom').value;
    const to    = document.getElementById('filterTo').value;
    const start = document.getElementById('filterStart').value;
    const end   = document.getElementById('filterEnd').value;

    let url = 'SmsHistoryServlet?';
    if (from)  url += 'from='  + encodeURIComponent(from)  + '&';
    if (to)    url += 'to='    + encodeURIComponent(to)    + '&';
    if (start) url += 'start=' + encodeURIComponent(start) + '&';
    if (end)   url += 'end='   + encodeURIComponent(end)   + '&';

    const tbody = document.getElementById('smsTableBody');
    tbody.innerHTML = '<tr><td colspan="6" class="no-data">Loading...</td></tr>';

    fetch(url)
        .then(r => r.json())
        .then(data => {
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No messages found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((sms, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${escHtml(sms.from)}</td>
                    <td>${escHtml(sms.to)}</td>
                    <td class="sms-body-cell">${escHtml(sms.body)}</td>
                    <td style="white-space:nowrap;">${formatDate(sms.date)}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                                onclick="deleteSms(${sms.id}, this)">🗑️ Delete</button>
                    </td>
                </tr>
            `).join('');
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="6" class="no-data">Failed to load history.</td></tr>';
        });
}

function clearFilters() {
    document.getElementById('filterFrom').value  = '';
    document.getElementById('filterTo').value    = '';
    document.getElementById('filterStart').value = '';
    document.getElementById('filterEnd').value   = '';
    loadHistory();
}

// ── Delete SMS ────────────────────────────────────────────────
function deleteSms(id, btn) {
    if (!confirm('Delete this message from your history?')) return;
    btn.disabled = true;
    btn.textContent = '...';

    const form = new FormData();
    form.append('message_id', id);

    fetch('DeleteSmsServlet', { method: 'POST', body: form })
        .then(r => {
            if (r.ok) {
                btn.closest('tr').remove();
                showAlert('success', '✅ Message deleted.');
            } else {
                btn.disabled = false;
                btn.textContent = '🗑️ Delete';
                showAlert('danger', '❌ Could not delete message.');
            }
        })
        .catch(() => {
            btn.disabled = false;
            btn.textContent = '🗑️ Delete';
        });
}

// ── Helpers ───────────────────────────────────────────────────
function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}
function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleString('en-GB', {
        day:'2-digit', month:'short', year:'numeric',
        hour:'2-digit', minute:'2-digit'
    });
}
</script>
</body>
</html>
